version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
  groups:
    patch:
      applies-to: version-updates
      patterns:
        - "*"
      update-types:
        - patch
  open-pull-requests-limit: 99
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  groups:
    patch:
      applies-to: version-updates
      patterns:
        - "*"
      update-types:
        - patch
  open-pull-requests-limit: 99
- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: weekly
  groups:
    patch:
      applies-to: version-updates
      patterns:
        - "*"
      update-types:
        - patch
  open-pull-requests-limit: 99
